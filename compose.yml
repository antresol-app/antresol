services:
  antresol:
    image: ghcr.io/antresol-app/antresol-server:latest
    container_name: antresol
    restart: unless-stopped
    stop_grace_period: 30s           # lets ffmpeg and open requests finish
    ports:
      - "${HTTP_PORT:-8420}:8420"      # web and apps; another host port: HTTP_PORT in .env
      - "${HTTP_PORT:-8420}:8420/udp"  # apps find the server on the home network (same port number)
    env_file:
      - path: .env
        required: false
    environment:
      VAULT_DATA_DIR: /config
      VAULT_MEDIA_ROOT: /media
      # folders inside MEDIA_DIR (container paths, relative to /media)
      VAULT_MOVIES_DIR: ${MOVIES_DIR:-movies}
      VAULT_SERIES_DIR: ${SERIES_DIR:-series}
      VAULT_MUSIC_DIR: ${MUSIC_DIR:-music}
      VAULT_BOOKS_DIR: ${BOOKS_DIR:-books}
      VAULT_EBOOKS_DIR: ${EBOOKS_DIR:-books/ebooks}
      VAULT_AUDIOBOOKS_DIR: ${AUDIOBOOKS_DIR:-books/audiobooks}
      VAULT_COMICS_DIR: ${COMICS_DIR:-books/manga}
      VAULT_TRANSCODE_DIR: /media/tmp/antresol-hls   # on the media disk, not in /config
      VAULT_ANNOUNCE_DIR: /announce  # shared with antresol-mdns
    volumes:
      - antresol-config:/config
      - ${MEDIA_DIR:-./media}:/media # host media folder, read-write
      - antresol-announce:/announce
    # devices:
    #   - /dev/dri:/dev/dri          # Intel/AMD GPU transcoding (the image joins its group itself)
    # group_add:                     # only with user: set: the host's render group
    #   - "992"                      # getent group render | cut -d: -f3 (the number differs per host)
    # deploy:                        # NVIDIA GPU (needs NVIDIA Container Toolkit)
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # antresol.local and the apps' search on the home network: mDNS only,
  # UDP 5353 on the host, no secrets (docs/install.md)
  antresol-mdns:
    image: ghcr.io/antresol-app/antresol-server:latest
    container_name: antresol-mdns
    restart: unless-stopped
    network_mode: host
    command: ["mdns-announce"]
    environment:
      VAULT_ANNOUNCE_DIR: /announce
      VAULT_ANNOUNCE_PORT: ${HTTP_PORT:-8420}  # the port published above
    volumes:
      - antresol-announce:/announce
    healthcheck:
      disable: true

  # An addon's helper service (see docs/install.md) goes here, under services:.

volumes:
  antresol-config:
  antresol-announce:
